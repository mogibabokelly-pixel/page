<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구미캠퍼스 식단정보</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f4;--card:#fff;--tx:#1d2a22;--mu:#6b7a70;--ac:#1f7a4d;--acbg:#e3f3ea;--bd:#e1e6e0;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--card:#1b231f;--tx:#e8efe9;--mu:#91a097;--ac:#5fd39a;--acbg:#1f3a2e;--bd:#2a3530;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121715;--card:#1b231f;--tx:#e8efe9;--mu:#91a097;--ac:#5fd39a;--acbg:#1f3a2e;--bd:#2a3530;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0}
.sub{color:var(--mu);font-size:13px;margin:4px 0 16px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tab{flex:1;min-width:52px;padding:10px 0;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.tab small{display:block;font-size:11px;font-weight:400;color:var(--mu)}
.tab.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tab.on small{color:#ffffffcc}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-top:12px}
.card.now{border-color:var(--ac);box-shadow:0 0 0 2px var(--acbg)}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.hd b{font-size:16px}
.hd span{font-size:12px;color:var(--mu)}
.badge{background:var(--acbg);color:var(--ac);font-size:11px;padding:2px 8px;border-radius:99px;margin-left:6px;font-weight:600}
ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
li{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:4px 10px;font-size:14px}
li.hl{background:var(--acbg);border-color:transparent;color:var(--ac);font-weight:600}
.note{font-size:12px;color:var(--mu);margin-top:18px}
</style>
</head>
<body>
<main>
<h1>🍚 구미캠퍼스 식단정보</h1>
<p class="sub">한국폴리텍대학 구미캠퍼스 · 이번 주 식단</p>
<div class="tabs" id="tabs"></div>
<div id="out"></div>
<p class="note">※ 메뉴는 식당 운영 및 식자재 수급 상황에 따라 변경될 수 있습니다.<br>석식은 수업이 있는 학생 대상 월~목 18시까지 운영됩니다.<br>출처: <a href="https://www.kopo.ac.kr/gumi/content.do?menu=4941" style="color:var(--ac)">학교 식단정보 페이지</a> (조회 시점 기준 스냅샷)</p>
</main>
<script>
var D=[
["월","컵밥,음료","잡곡밥,만둣국,돈갈비찜,꽃맛살샐러드,오이양파무침,포기김치","쌀밥,얼큰쇠고기무국,두부조림,모듬강정,호박당근볶음,포기김치"],
["화","모카크림빵,흰우유","잡곡밥,참치김치찌개,어니언치킨까스,건새우마늘쫑무침,단배추생채,깍두기","흰밥,돼지국밥,야채고로케/케찹,풋고추된장무침,부추양파무침,석박지/요구르트"],
["수","컵밥,음료","나가사끼짬뽕,마파두부,깐쇼새우,토마토샐러드/드레싱,포기김치,흰밥","흰밥,유부장국,불닭볶음닭,맛감자/케이준S,케요네즈,포기김치"],
["목","모카크림빵,흰우유","잡곡밥,조랭이미역국,바싹불고기/파채,무조림,명엽채조림,포기김치","흰밥,부대찌개,계란후라이,청양멸치볶음,상추양파무침,포기김치"],
["금","컵밥,음료","콩나물밥/양념장,바지락고추장찌개,팽이버섯짬뽕조림,도시락김,포기김치,음료","쌀밥,계란탕,오징어당면볶음,강된장,양배추찜/간장,포기김치"]
];
var M=[["🌅 조식","07:50 ~ 08:40",1,7*60+50,8*60+40],["☀️ 중식","11:50 ~ 13:10",2,11*60+50,13*60+10],["🌙 석식","16:50 ~ 17:40",3,16*60+50,17*60+40]];
var now=new Date(),wd=now.getDay(),today=(wd>=1&&wd<=5)?wd-1:-1,sel=today<0?0:today;
var mon=new Date(now);mon.setDate(now.getDate()-((wd+6)%7));
var mins=now.getHours()*60+now.getMinutes();
function render(){
  var t=document.getElementById("tabs");t.innerHTML="";
  D.forEach(function(d,i){
    var dt=new Date(mon);dt.setDate(mon.getDate()+i);
    var b=document.createElement("button");b.className="tab"+(i===sel?" on":"");
    b.innerHTML=d[0]+"<small>"+(dt.getMonth()+1)+"/"+dt.getDate()+(i===today?" 오늘":"")+"</small>";
    b.onclick=function(){sel=i;render()};t.appendChild(b);
  });
  var o=document.getElementById("out");o.innerHTML="";
  M.forEach(function(m){
    var live=sel===today&&mins>=m[3]&&mins<=m[4];
    var c=document.createElement("div");c.className="card"+(live?" now":"");
    var items=D[sel][m[2]].split(",").map(function(x){
      return "<li"+(x.charAt(0)==="*"?' class="hl"':"")+">"+x.replace(/\*/g,"")+"</li>";
    }).join("");
    c.innerHTML='<div class="hd"><div><b>'+m[0]+'</b>'+(live?'<span class="badge">운영 중</span>':"")+'</div><span>'+m[1]+'</span></div><ul>'+items+'</ul>';
    o.appendChild(c);
  });
}
render();
</script>
</body>
</html>
